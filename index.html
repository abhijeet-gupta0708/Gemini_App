<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta
      name="description"
      content="A focused AI chat workspace powered by Gemini. Ask anything, keep your conversations, and pick up where you left off."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Gemini — AI chat workspace</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("gemini.theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
          if (stored !== "system") {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", dark ? "#0a0a0d" : "#faf9f7");
          }
          if (localStorage.getItem("gemini.reduce-motion") === "true") {
            root.dataset.reduceMotion = "true";
          }
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
